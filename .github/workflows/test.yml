name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-prerequisites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/setup_host_prerequisites.sh --install
      - run: bash scripts/setup_host_prerequisites.sh --check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.18"
      - run: uv sync --python 3.14.7 --frozen
        working-directory: backend
      - run: uv run pytest -m "not integration"
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: frontend
      # --run: watchモードに入らず1回だけ実行する
      # --passWithNoTests: テストが0件でも成功扱いにする。frontendのテストを
      #   書き始めたら外す（テストが消えたことに気づけなくなるため）
      - run: bun run test -- --run --passWithNoTests
        working-directory: frontend
