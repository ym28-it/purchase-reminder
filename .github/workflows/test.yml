name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
      - run: uv run pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: frontend
      # --run: watchモードに入らず1回だけ実行する
      # --passWithNoTests: テストが0件でも成功扱いにする。frontendのテストを
      #   書き始めたら外す（テストが消えたことに気づけなくなるため）
      - run: bun run test -- --run --passWithNoTests
        working-directory: frontend
