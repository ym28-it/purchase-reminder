[settings]
# Environment Gate tools are installed explicitly by setup_host_prerequisites.sh.
# Do not let `mise exec` install unrelated project tools from network backends.
exec_auto_install = false

[env]
# Python is installed by uv into repository-local state. Never fall back to a
# system interpreter, which would make clean Work/Claude Code runs diverge.
UV_MANAGED_PYTHON = "1"
UV_PYTHON_INSTALL_DIR = "{{config_root}}/.mise/uv-python"

[tools]
uv = "0.12.18"
java = "temurin-17"
bun = "latest"
terraform = "1.15"
pre-commit = "latest"
direnv = "latest"
